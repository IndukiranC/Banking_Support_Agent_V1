version: '3.8'

services:
  banking-agent:
    build: .
    container_name: banking_agent_app
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:latest
      - DATABASE_URL=sqlite:///./data/banking.db
      - JWT_SECRET_KEY=banking-super-secret-key-change-in-prod-78901234
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
